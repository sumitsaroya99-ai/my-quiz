<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz About Me</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .question { margin-bottom: 15px; }
    .result { font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Quiz About Me</h1>
  <form id="quizForm">
    <div class="question">
      <p>1. What is my favorite color?</p>
      <input type="radio" name="q1" value="blue"> Blue<br>
      <input type="radio" name="q1" value="green"> Green<br>
      <input type="radio" name="q1" value="red"> Red<br>
    </div>

    <div class="question">
      <p>2. Which city am I from?</p>
      <input type="radio" name="q2" value="Delhi"> Delhi<br>
      <input type="radio" name="q2" value="Punjab"> Punjab<br>
      <input type="radio" name="q2" value="Mumbai"> Mumbai<br>
    </div>

    <button type="button" onclick="checkAnswers()">Submit</button>
  </form>

  <div class="result" id="result"></div>

  <script>
    function checkAnswers() {
      let score = 0;
      let total = 2;

      // Correct answers
      if (document.querySelector('input[name="q1"]:checked')?.value === "blue") score++;
      if (document.querySelector('input[name="q2"]:checked')?.value === "Punjab") score++;

      document.getElementById("result").innerText =
        "You scored " + score + " out of " + total;
    }
  </script>
</body>
</html>
